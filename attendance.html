<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Enterprise Large and Mega Projects — Attendance Log</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --muted: #6b6b6b;
  --bg: #f4f1fb;
  --card: #fff;
  --btn-start: #A666B0;
  --btn-end: #573B92;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  font-family: 'Cairo', sans-serif;
  color: #111;
}

.header-box {
  width: 100%;
  max-width: 420px;
  margin: 26px auto 0 auto;
  background: linear-gradient(135deg, var(--btn-start), var(--btn-end));
  padding: 26px 16px 30px 16px;
  border-radius: 20px;
  text-align: center;
  color: #fff;
  box-shadow: 0 6px 20px rgba(111,47,144,0.22);
}
.header-title {
  font-size: 22px;
  font-weight: 700;
  -webkit-animation: fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) both;
  animation: fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) both;
}
.header-sub {
  margin-top: 6px;
  font-size: 15px;
  opacity: 0.92;
  -webkit-animation: fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
  animation: fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
}
@-webkit-keyframes fadeDown {
  from { opacity: 0; -webkit-transform: translateY(-18px); }
  to   { opacity: 1; -webkit-transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.container { padding: 22px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; }

.card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.08);
  margin-top: 20px;
}

.label-title {
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  margin-top: 12px;
  color: #555;
}

.select {
  display: block;
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #e0e0e0;
  font-size: 16px;
  font-family: 'Cairo', sans-serif;
  background: #fff;
  color: #111;
  -webkit-appearance: none;
  appearance: none;
}

.controls { display: -webkit-box; display: -webkit-flex; display: flex; gap: 10px; margin-top: 20px; }

/* ===== BUTTONS ===== */
.btn-full {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  height: 56px;
  padding: 0;
  font-size: 17px;
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(111,47,144,0.30), 0 3px 6px rgba(0,0,0,0.18);
  position: relative;
  overflow: hidden;
  -webkit-appearance: none;
}
.btn-full:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
.btn-full:disabled { opacity: 0.7; cursor: not-allowed; }
.btn-full.success { background: linear-gradient(135deg, #2e7d32, #1b5e20) !important; box-shadow: 0 6px 14px rgba(46,125,50,0.35) !important; }

.btn-inner {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  gap: 8px;
  height: 100%;
  width: 100%;
}

/* ===== SPINNER ===== */
.spinner {
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  -webkit-animation: spin 0.7s linear infinite;
  animation: spin 0.7s linear infinite;
  display: none;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin         { to { transform: rotate(360deg); } }

/* ===== CHECKMARK ===== */
.check-wrap {
  display: none;
  width: 22px;
  height: 22px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.check-wrap svg {
  width: 22px;
  height: 22px;
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.check-path {
  stroke-dasharray: 24;
  stroke-dashoffset: 24;
  -webkit-transition: stroke-dashoffset 0.35s ease 0.1s;
  transition: stroke-dashoffset 0.35s ease 0.1s;
}
.check-path.drawn { stroke-dashoffset: 0; }

/* ===== SHAKE ===== */
@-webkit-keyframes shake {
  0%,100%{ -webkit-transform: translateX(0); }
  20%    { -webkit-transform: translateX(-8px); }
  40%    { -webkit-transform: translateX(8px); }
  60%    { -webkit-transform: translateX(-5px); }
  80%    { -webkit-transform: translateX(5px); }
}
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-5px); }
  80%    { transform: translateX(5px); }
}
.shake { -webkit-animation: shake 0.4s ease !important; animation: shake 0.4s ease !important; }

.logout {
  background: transparent;
  border: 1px solid #ddd;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-family: 'Cairo', sans-serif;
  color: #666;
  cursor: pointer;
}

.msg { min-height: 22px; margin-top: 14px; text-align: center; font-weight: 700; font-size: 14px; }
.footer-image { margin-top: 14px; margin-bottom: 10px; text-align: center; }
.footer-image img { width: 100%; max-width: 220px; height: auto; }
.small-muted { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }

/* ===== PULSE MSG (Fake Location) ===== */
.pulse-msg {
  display: none;
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #c62828;
  -webkit-animation: pulseText 0.5s ease;
  animation: pulseText 0.5s ease;
}
@-webkit-keyframes pulseText {
  0%   { opacity:0; -webkit-transform:scale(0.7); }
  60%  { -webkit-transform:scale(1.1); }
  100% { opacity:1; -webkit-transform:scale(1); }
}
@keyframes pulseText {
  0%   { opacity:0; transform:scale(0.7); }
  60%  { transform:scale(1.1); }
  100% { opacity:1; transform:scale(1); }
}
.pulse-icon-wrap {
  width: 44px;
  height: 44px;
  background: #ffebee;
  border-radius: 50%;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  margin: 0 auto 6px auto;
  -webkit-animation: pulsering 0.6s ease 0.1s;
  animation: pulsering 0.6s ease 0.1s;
}
@-webkit-keyframes pulsering {
  0%   { -webkit-transform:scale(0.5); }
  70%  { -webkit-transform:scale(1.15); }
  100% { -webkit-transform:scale(1); }
}
@keyframes pulsering {
  0%   { transform:scale(0.5); }
  70%  { transform:scale(1.15); }
  100% { transform:scale(1); }
}
</style>
</head>
<body>

<div class="header-box">
  <div class="header-title">Enterprise Large and Mega Projects</div>
  <div class="header-sub">Attendance Log</div>
</div>

<main class="container">
  <section class="card">

    <div style="display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:end;-webkit-justify-content:flex-end;justify-content:flex-end;">
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <label class="label-title" for="location">Location</label>

    <select id="location" class="select">
      <option value="" disabled selected>Select Location</option>
      <option value="Dokki">Dokki</option>
      <option value="WFH">WFH</option>
      <option value="Meeting">Meeting</option>
      <option value="Smart">Smart</option>
      <option value="Ganoub Mostasmreen">Ganoub Mostasmreen</option>
      <option value="Kattamya">Kattamya</option>
      <option value="Helwan">Helwan</option>
      <option value="Maadi">Maadi</option>
      <option value="TMG Projects">TMG Projects</option>
    </select>

    <div class="controls">
      <button class="btn-full" id="btnIN" style="background:linear-gradient(135deg,#A666B0,#C28AD0)" onclick="send('IN')">
        <div class="btn-inner">
          <div class="spinner" id="spIN"></div>
          <div class="check-wrap" id="ckIN">
            <svg viewBox="0 0 22 22"><polyline class="check-path" id="cpIN" points="4,11 9,16 18,6"/></svg>
          </div>
          <span id="txtIN">IN</span>
        </div>
      </button>
      <button class="btn-full" id="btnOUT" style="background:linear-gradient(135deg,#7457B0,#573B92)" onclick="send('OUT')">
        <div class="btn-inner">
          <div class="spinner" id="spOUT"></div>
          <div class="check-wrap" id="ckOUT">
            <svg viewBox="0 0 22 22"><polyline class="check-path" id="cpOUT" points="4,11 9,16 18,6"/></svg>
          </div>
          <span id="txtOUT">OUT</span>
        </div>
      </button>
    </div>

    <div id="msg" class="msg"></div>
    <div class="pulse-msg" id="fakeMsg">
      <div class="pulse-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      Fake Location Attempt Blocked!
    </div>
    <div class="pulse-msg" id="gpsMsg">
      <div class="pulse-icon-wrap" style="background:#e3f2fd;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
          <line x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </div>
      <span style="color:#0d47a1;">GPS access denied</span>
    </div>
    <div class="pulse-msg" id="locMsg">
      <div class="pulse-icon-wrap" style="background:#ede7f6;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#573B92" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <span style="color:#573B92;">Please select a location!</span>
    </div>
    <div class="pulse-msg" id="connMsg">
      <div class="pulse-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M12 20h.01"/>
        </svg>
      </div>
      Connection Error
    </div>
    <div class="footer-image"><img src="logooo.png" alt="Logo"></div>
    <div class="small-muted" id="who"></div>

  </section>
</main>

<script>
var API  = "https://script.google.com/macros/s/AKfycbwCCul0HodDRuRQiQxbM8ntQagR0mF-oAXRGvQVp-NAMbW0kj45-6sbVPN25-pgVPWLWA/exec";
var ID   = localStorage.getItem("ID");
var NAME = localStorage.getItem("name") || ID;

if(!ID) location.href = "login.html";
document.getElementById("who").textContent = NAME;

function getDevice(){
  var ua = navigator.userAgent;
  if(/android/i.test(ua))       return "Android";
  if(/iphone|ipad|ipod/i.test(ua)) return "iOS";
  if(/windows/i.test(ua))       return "Windows";
  if(/mac/i.test(ua))           return "MacOS";
  return "Unknown";
}
function getBrowser(){
  var ua = navigator.userAgent;
  if(ua.indexOf("Chrome")  > -1 && ua.indexOf("Edg") === -1) return "Chrome";
  if(ua.indexOf("Safari")  > -1 && ua.indexOf("Chrome") === -1) return "Safari";
  if(ua.indexOf("Firefox") > -1) return "Firefox";
  if(ua.indexOf("Edg")     > -1) return "Edge";
  return "Unknown";
}
function getIP(){
  return fetch("https://api.ipify.org?format=json")
    .then(function(r){ return r.json(); })
    .then(function(j){ return j.ip || ""; })
    .catch(function(){ return ""; });
}
function logout(){
  localStorage.removeItem("ID");
  localStorage.removeItem("name");
  location.href = "login.html";
}

function setLoading(type){
  var btn   = document.getElementById('btn'+type);
  var sp    = document.getElementById('sp'+type);
  var txt   = document.getElementById('txt'+type);
  var other = document.getElementById('btn'+(type==='IN'?'OUT':'IN'));
  btn.disabled   = true;
  other.disabled = true;
  sp.style.display = 'block';
  txt.textContent  = 'Sending...';
  txt.style.opacity = '0.75';
  document.getElementById('msg').textContent = '';
}

function setSuccess(type){
  var btn = document.getElementById('btn'+type);
  var sp  = document.getElementById('sp'+type);
  var ck  = document.getElementById('ck'+type);
  var cp  = document.getElementById('cp'+type);
  var txt = document.getElementById('txt'+type);
  var msg = document.getElementById('msg');
  sp.style.display = 'none';
  btn.classList.add('success');
  ck.style.display = 'block';
  setTimeout(function(){ cp.classList.add('drawn'); }, 60);
  txt.textContent   = type==='IN' ? 'Checked IN!' : 'Checked OUT!';
  txt.style.opacity = '1';
  msg.style.color   = '#2e7d32';
  msg.textContent   = 'Attendance added successfully';
}

function setError(type, text, isFake){
  var btn   = document.getElementById('btn'+type);
  var sp    = document.getElementById('sp'+type);
  var ck    = document.getElementById('ck'+type);
  var txt   = document.getElementById('txt'+type);
  var other = document.getElementById('btn'+(type==='IN'?'OUT':'IN'));
  var msg   = document.getElementById('msg');
  var fakeMsg = document.getElementById('fakeMsg');
  var gpsMsg  = document.getElementById('gpsMsg');
  sp.style.display = 'none';
  ck.style.display = 'none';
  btn.classList.remove('success');
  txt.textContent   = type;
  txt.style.opacity = '1';
  btn.disabled      = false;
  other.disabled    = false;
  btn.classList.remove('shake');
  void btn.offsetWidth;
  btn.classList.add('shake');

  msg.textContent = '';
  fakeMsg.style.display = 'none';
  gpsMsg.style.display  = 'none';
  document.getElementById('locMsg').style.display  = 'none';
  document.getElementById('connMsg').style.display = 'none';

  if(isFake === true){
    void fakeMsg.offsetWidth;
    fakeMsg.style.display = 'block';
  } else if(isFake === 'gps'){
    void gpsMsg.offsetWidth;
    gpsMsg.style.display = 'block';
  } else if(isFake === 'conn'){
    var connMsg = document.getElementById('connMsg');
    void connMsg.offsetWidth;
    connMsg.style.display = 'block';
  } else {
    msg.style.color = 'red';
    msg.textContent = text;
  }
}

function send(type){
  var loc    = document.getElementById("location").value;
  var locMsg = document.getElementById("locMsg");

  if(!loc){
    locMsg.style.display = 'none';
    void locMsg.offsetWidth;
    locMsg.style.display = 'block';
    return;
  }

  setLoading(type);

  getIP().then(function(ip){
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var payload = {
          action: "attendance",
          ID: ID,
          name: NAME,
          type: type,
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          acc: pos.coords.accuracy,
          device: getDevice(),
          browser: getBrowser(),
          location: loc,
          ip: ip
        };

        fetch(API, { method: "POST", body: JSON.stringify(payload) })
          .then(function(res){ return res.json(); })
          .then(function(j){
            if(j.status==="fail" || j.message==="outside_location_range"){
              setError(type, "", true);
              setTimeout(logout, 2500);
              return;
            }
            if(j.message==="no_gps"){ setError(type, "GPS not available!"); return; }
            if(j.status==="saved"){
              setSuccess(type);
              setTimeout(logout, 2200);
            }
          })
          .catch(function(){ setError(type, "", 'conn'); });
      },
      function(){ setError(type, "", 'gps'); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
    );
  });
}

var inactivityTimer;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(logout, 10*60*1000);
}
document.addEventListener("click",      resetInactivityTimer);
document.addEventListener("touchstart", resetInactivityTimer);
document.addEventListener("mousemove",  resetInactivityTimer);
document.addEventListener("keydown",    resetInactivityTimer);
resetInactivityTimer();
</script>
</body>
</html>
