<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Enterprise Large and Mega Projects — Attendance Log</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --we-purple:#6f2f90;
  --muted:#6b6b6b;
  --bg:#f4f1fb;
  --card:#fff;
  --accent:#00a3e0;
  --btn-start:#A666B0;
  --btn-end:#573B92;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);font-family:'Cairo',sans-serif;animation:fadeIn 0.4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.header-box{width:100%;max-width:420px;margin:26px auto 0 auto;background:linear-gradient(135deg,var(--btn-start),var(--btn-end));padding:26px 16px 30px 16px;border-radius:20px;text-align:center;color:#fff;box-shadow:0 6px 20px rgba(111,47,144,0.22);}
.header-title{font-size:22px;font-weight:700;}
.header-sub{margin-top:6px;font-size:15px;opacity:0.92;}
.wrap{display:flex;justify-content:center;padding:22px;margin-top:20px;}
.card{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:26px;box-shadow:0 8px 28px rgba(0,0,0,0.08);}
.label{font-size:14px;color:var(--muted);margin-top:14px;}
.input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #e0e0e0;font-size:16px;margin-top:6px;transition:0.25s;}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,163,224,0.35);}

/* ===== BUTTON ===== */
.btn{
  width:100%;margin-top:22px;padding:16px;font-size:17px;color:#fff;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--btn-start),var(--btn-end));
  box-shadow:0 6px 14px rgba(111,47,144,0.30),0 3px 6px rgba(0,0,0,0.18),inset 0 2px 4px rgba(255,255,255,0.22);
  cursor:pointer;transition:0.18s ease;
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(0.96);}
.btn:disabled{opacity:0.75;cursor:not-allowed;}
.btn.success{background:linear-gradient(135deg,#2e7d32,#1b5e20) !important;}

/* ===== SPINNER ===== */
.spinner{
  width:20px;height:20px;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:none;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== CHECKMARK ===== */
.check-circle{width:20px;height:20px;display:none;flex-shrink:0;}
.check-circle svg{width:20px;height:20px;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.check-path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset 0.35s ease 0.1s;}

/* ===== SHAKE ===== */
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);};}

.msg{height:22px;text-align:center;font-weight:600;font-size:14px;margin-top:12px;}
.footer-image{margin-top:12px;margin-bottom:10px;text-align:center;}
.footer-image img{width:100%;max-width:220px;height:auto;}
.footer-note{font-size:12px;color:#9a9a9a;margin-top:8px;text-align:center;}
</style>
</head>
<body>

<div class="header-box">
  <div class="header-title">Enterprise Large and Mega Projects</div>
  <div class="header-sub">Attendance Log</div>
</div>

<main class="wrap">
  <section class="card">

    <label class="label" for="userid">ID</label>
    <input id="userid" class="input" type="text" autocomplete="username" inputmode="numeric">

    <label class="label" for="password">Password</label>
    <input id="password" class="input" type="password" autocomplete="current-password">

    <button class="btn" id="loginBtn" onclick="login()">
      <div class="spinner" id="spinner"></div>
      <div class="check-circle" id="checkCircle">
        <svg viewBox="0 0 20 20"><polyline class="check-path" id="checkPath" points="4,10 8,14 16,6"/></svg>
      </div>
      <span id="btnText">Login</span>
    </button>

    <div id="msg" class="msg"></div>

    <div class="footer-image"><img src="logooo.png" alt="Logooo"></div>
    <div class="footer-note">Enterprise Project Management | Large &amp; Mega Projects Unit</div>

  </section>
</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbwkszxNpvH5Qib5JS6T3VEqMKzRJPU3EY7eVLt1_0tnL1N_drqBVBGC99vITMemxfuyCA/exec";
if(localStorage.getItem('ID')) location.href='attendance.html';

const loginBtn  = document.getElementById('loginBtn');
const spinner   = document.getElementById('spinner');
const checkCircle = document.getElementById('checkCircle');
const checkPath = document.getElementById('checkPath');
const btnText   = document.getElementById('btnText');
const msg       = document.getElementById('msg');

function setLoading(){
  loginBtn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Checking...';
  btnText.style.opacity = '0.7';
  msg.textContent = '';
}

function setSuccess(){
  spinner.style.display = 'none';
  loginBtn.classList.add('success');
  checkCircle.style.display = 'block';
  setTimeout(()=>{ checkPath.style.strokeDashoffset='0'; }, 50);
  btnText.textContent = 'Welcome!';
  btnText.style.opacity = '1';
  msg.style.color = '#2e7d32';
  msg.textContent = 'Redirecting...';
}

function setError(text){
  spinner.style.display = 'none';
  btnText.textContent = 'Login';
  btnText.style.opacity = '1';
  loginBtn.disabled = false;
  loginBtn.classList.remove('success');
  loginBtn.style.animation = 'none';
  loginBtn.offsetHeight;
  loginBtn.style.animation = 'shake 0.4s ease';
  msg.style.color = 'red';
  msg.textContent = text;
}

async function login(){
  const id   = document.getElementById('userid').value.trim();
  const pass = document.getElementById('password').value.trim();

  if(!id || !pass){ setError('Please fill all fields'); return; }

  setLoading();

  try{
    const r = await fetch(API,{method:'POST',body:JSON.stringify({action:'login',ID:id,password:pass})});
    const j = await r.json();

    if(j.status==='success'){
      localStorage.setItem('ID',j.ID);
      localStorage.setItem('name',j.name);
      setSuccess();
      setTimeout(()=>location.href='attendance.html', 1200);
    } else {
      setError('Invalid ID or Password');
    }
  }catch(e){
    setError('Connection Error');
  }
}
</script>
</body>
</html>
